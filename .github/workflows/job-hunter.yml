name: Job Hunter Daily

on:
  schedule:
    # 北京时间 17:00 = UTC 9:00
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install deps
      run: pip install requests beautifulsoup4
    - name: Fetch jobs
      run: python scripts/fetch_jobs.py
    - name: Push to WeChat
      env:
        SC_KEY: ${{ secrets.SC_KEY }}
      run: python scripts/push_jobs.py
    - name: Commit results
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/jobs.txt
        git diff --staged --quiet || git commit -m "Daily jobs update $(date +%Y-%m-%d)"
        git push
